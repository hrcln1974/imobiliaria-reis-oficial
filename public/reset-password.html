<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova senha — Fabiano Reis Imóveis</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/premium.css"></head>
<body class="auth-page"><main class="auth-card"><a href="/" class="back-link">← Voltar ao site</a>
<h1>Definir nova senha</h1><p>A senha precisa ter 12+ caracteres, uma letra maiúscula e um número.</p>
<form id="resetForm"><label for="password">Nova senha</label><input id="password" type="password" autocomplete="new-password" minlength="12" required>
<label for="confirmPassword">Confirmar senha</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
<button class="btn-primary" type="submit" id="submit">Redefinir senha</button></form><div id="msg" role="status"></div></main>
<script>
const token=new URLSearchParams(location.search).get('token')||'',form=document.getElementById('resetForm'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
async function check(){if(!/^[a-f0-9]{64}$/i.test(token)){form.style.display='none';msg.textContent='Link de recuperação inválido.';return}const r=await fetch('/api/auth/validate-reset-token?token='+encodeURIComponent(token));const d=await r.json();if(!d.valid){form.style.display='none';msg.textContent='Link expirado ou já utilizado.'}}
check().catch(()=>{form.style.display='none';msg.textContent='Não foi possível validar o link.'});
form.addEventListener('submit',async e=>{e.preventDefault();if(form.password.value!==form.confirmPassword.value){msg.textContent='As senhas não conferem.';return}btn.disabled=true;btn.textContent='Salvando...';try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:form.password.value,confirmPassword:form.confirmPassword.value})});const d=await r.json();msg.textContent=d.mensagem||d.erro||'Concluído.';if(r.ok){form.reset();setTimeout(()=>location.href='/?login=1',1500)}}catch(_){msg.textContent='Não foi possível redefinir a senha.'}finally{btn.disabled=false;btn.textContent='Redefinir senha'}});
</script></body></html>
