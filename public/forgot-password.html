<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar senha — Fabiano Reis Imóveis</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/premium.css"></head>
<body class="auth-page"><main class="auth-card"><a href="/" class="back-link">← Voltar ao site</a>
<h1>Recuperar senha</h1><p>Informe seu e-mail. Se ele estiver cadastrado, enviaremos as instruções.</p>
<form id="forgotForm"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="160">
<button class="btn-primary" type="submit" id="submit">Enviar instruções</button></form><div id="msg" role="status"></div></main>
<script>
const form=document.getElementById('forgotForm'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Enviando...';
try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value})});const d=await r.json();msg.textContent=d.mensagem||d.erro||'Solicitação processada.';form.reset();}catch(_){msg.textContent='Não foi possível processar agora. Tente novamente.'}finally{btn.disabled=false;btn.textContent='Enviar instruções'}});
</script></body></html>
